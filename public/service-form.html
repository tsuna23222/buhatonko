<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offer a service – BuhatonKo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <div class="card form-card">
      <h1 id="form-title">Offer a service</h1>
      <form id="service-form">
        <label>Title<input type="text" name="title" maxlength="120" required placeholder="I will design a logo for your org"></label>
        <label>Category<select name="category_id" required></select></label>
        <label>Description
          <textarea name="description" rows="6" required placeholder="What's included, what the customer needs to provide, file formats, number of revisions..."></textarea>
        </label>
        <div class="row">
          <label>Price (₱)<input type="number" name="price" min="0" step="0.01" required></label>
          <label>Price type<select name="price_type">
            <option value="starting">Starting price</option>
            <option value="fixed">Fixed price</option>
          </select></label>
        </div>
        <div class="row">
          <label>Delivery time (days)<input type="number" name="delivery_days" min="1" value="3"></label>
          <label>Delivery mode<select name="delivery_mode">
            <option value="online">Online</option>
            <option value="in_person">In person</option>
            <option value="both">Online or in person</option>
          </select></label>
        </div>
        <button type="submit">Publish service</button>
      </form>
      <p id="message"></p>
    </div>
  </main>

  <footer class="footer">BuhatonKo · A student-to-student freelance marketplace</footer>

  <script src="/js/common.js"></script>
  <script src="/js/service-form.js"></script>
</body>
</html>
