<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – BuhatonKo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1>Dashboard</h1>

    <section class="section">
      <h2>Requests for my services <span class="muted">(I'm the provider)</span></h2>
      <div id="incoming"></div>
    </section>

    <section class="section">
      <h2>My requests <span class="muted">(I'm hiring)</span></h2>
      <div id="outgoing"></div>
    </section>

    <section class="section">
      <h2>My services</h2>
      <div id="services"></div>
      <p><a href="/service-form.html" class="btn">+ Offer a new service</a></p>
    </section>
  </main>

  <footer class="footer">BuhatonKo · A student-to-student freelance marketplace</footer>

  <script src="/js/common.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
