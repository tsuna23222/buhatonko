<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse services – BuhatonKo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="container">
    <h1>Browse services</h1>
    <form id="filters" class="filters">
      <label>Search<input type="search" name="q" placeholder="e.g. logo, math tutor"></label>
      <label>Category<select name="category"><option value="">All categories</option></select></label>
      <label>Max price (₱)<input type="number" name="max_price" min="0"></label>
      <label>Delivery<select name="mode">
        <option value="">Any</option>
        <option value="online">Online</option>
        <option value="in_person">In person</option>
      </select></label>
      <button type="submit">Search</button>
    </form>
    <p id="count" class="muted"></p>
    <div id="results" class="grid"></div>
  </main>

  <footer class="footer">BuhatonKo · A student-to-student freelance marketplace</footer>

  <script src="/js/common.js"></script>
  <script src="/js/browse.js"></script>
</body>
</html>
