<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – BuhatonKo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <h1>Admin panel</h1>

    <section class="section">
      <h2>Overview</h2>
      <div id="stats" class="grid"></div>
    </section>

    <section class="section">
      <h2>Reports</h2>
      <div id="reports"></div>
    </section>

    <section class="section">
      <h2>Students <span class="muted">(unverified first)</span></h2>
      <div id="users"></div>
    </section>

    <section class="section">
      <h2>Service listings</h2>
      <div id="services"></div>
    </section>

    <section class="section">
      <h2>Categories</h2>
      <div id="categories" class="category-list"></div>
      <form id="category-form" class="filters" style="margin-top:14px">
        <label>New category<input name="name" maxlength="100" required></label>
        <button type="submit">Add category</button>
      </form>
      <p id="category-message"></p>
    </section>
  </main>

  <footer class="footer">BuhatonKo · A student-to-student freelance marketplace</footer>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
